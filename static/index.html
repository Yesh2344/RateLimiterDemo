<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RateLimiterDemo<!-- cleaner this way --></title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        /* Simple responsive layout */
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 2rem;
            background: #f5f5f5;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,.1);
        }
        button {
            background: #0069d9;
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }
        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }
        pre {
            background: #eee;
            padding: 1rem;
            border-radius: 4px;
            overflow-x: auto;
        }
        .error {
            color: #d9534f;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>RateLimiterDemo API Client</h1>
    <p>Click the button to request data from the protected endpoint.</p>
    <button id="fetchBtn">Fetch Data</button>
    <p id="status"></p>
    <pre id="output"></pre>
</div>

<script type="module">
    const btn = document.getElementById('fetchBtn');
    const statusEl = document.getElementById('status');
    const outputEl = document.getElementById('output');

    async function fetchData() {
        btn.disabled = true;
        statusEl.textContent = 'Loading...';
        outputEl.textContent = '';
        try {
            const response = await fetch('/api/data');
            if (!response.ok) {
                const err = await response.json();
                throw new Error(`${response.status} ${err.message || err.error}`);
            }
            const data = await response.json();
            outputEl.textContent = JSON.stringify(data, null, 2);
            statusEl.textContent = 'Success!';
        } catch (e) {
            statusEl.textContent = '';
            outputEl.textContent = e.message;
            outputEl.classList.add('error');
        } finally {
            btn.disabled = false;
        }
    }

    btn.addEventListener('click', fetchData);
</script>
</body>
</html>
